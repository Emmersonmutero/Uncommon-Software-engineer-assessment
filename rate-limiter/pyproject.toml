[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimiter"
version = "0.1.0"
description = "In-memory, per-key rate limiter (sliding window and token bucket policies)."
requires-python = ">=3.9"

[tool.setuptools]
packages = ["ratelimiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
